apiVersion: v1
kind: Service

metadata:
  name: elasticsearch
  namespace: flashstore

  labels:
    app.kubernetes.io/name: elasticsearch
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: flashstore

spec:
  selector:
    app: elasticsearch

  ports:
    - name: http
      port: 9200
      targetPort: 9200

    - name: transport
      port: 9300
      targetPort: 9300