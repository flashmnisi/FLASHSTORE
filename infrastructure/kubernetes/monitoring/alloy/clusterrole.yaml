apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: alloy
  labels:
    app.kubernetes.io/name: alloy
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/part-of: flashstore
rules:
  - apiGroups: [""]
    resources:
      - nodes
      - nodes/proxy
      - nodes/metrics
      - namespaces
      - services
      - endpoints
      - pods
      - pods/log
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["discovery.k8s.io"]
    resources:
      - endpointslices
    verbs:
      - get
      - list
      - watch

  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
    verbs:
      - get
      - list
      - watch

  - nonResourceURLs:
      - /metrics
      - /metrics/cadvisor
    verbs:
      - get