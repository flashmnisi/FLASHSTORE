apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

configMapGenerator:
  - name: grafana-dashboards-kubernetes

    files:
      - deployments.json
      - hpa.json
      - ingress.json
      - namespaces.json
      - networking.json
      - nodes.json
      - pods.json
      - pvc-storage.json

generatorOptions:
  disableNameSuffixHash: true

labels:
  - pairs:
      grafana_dashboard: "1"

      app.kubernetes.io/name: grafana
      app.kubernetes.io/component: dashboards
      app.kubernetes.io/part-of: flashstore