  - clusterrole.yaml
  - clusterrolebinding.yaml
  - deployment.yaml
  - service.yaml

labels:
  - pairs:
      app.kubernetes.io/name: kube-state-metrics
      app.kubernetes.io/instance: flashstore
      app.kubernetes.io/component: monitoring
      app.kubernetes.io/part-of: flashstore