apiVersion: apps/v1
kind: Deployment

metadata:
  name: loki
  namespace: monitoring

  labels:
    app.kubernetes.io/name: loki
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/component: logging
    app.kubernetes.io/part-of: flashstore

spec:
  replicas: 1

  selector:
    matchLabels:
      app.kubernetes.io/name: loki
      app.kubernetes.io/instance: flashstore

  template:
    metadata:
      labels:
        app.kubernetes.io/name: loki
        app.kubernetes.io/instance: flashstore
        app.kubernetes.io/component: logging
        app.kubernetes.io/part-of: flashstore

    spec:
      securityContext:
        fsGroup: 10001
        runAsUser: 10001
        runAsNonRoot: true

      containers:
        - name: loki
          image: grafana/loki:3.4.2
          imagePullPolicy: IfNotPresent

          args:
            - -config.file=/etc/loki/loki.yaml

          ports:
            - name: http
              containerPort: 3100
              protocol: TCP

            - name: grpc
              containerPort: 9096
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /etc/loki
              readOnly: true

            - name: data
              mountPath: /loki

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          startupProbe:
            httpGet:
              path: /ready
              port: http
            failureThreshold: 30
            periodSeconds: 5

          readinessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /ready
              port: http
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

      volumes:
        - name: config
          configMap:
            name: loki-config

            items:
              - key: loki.yaml
                path: loki.yaml

        - name: data
          persistentVolumeClaim:
            claimName: loki-data