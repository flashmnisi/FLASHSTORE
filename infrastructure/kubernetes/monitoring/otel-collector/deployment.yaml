apiVersion: apps/v1
kind: Deployment

metadata:
  name: otel-collector
  namespace: monitoring

  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/version: "0.120.0"
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: flashstore

spec:
  replicas: 1

  revisionHistoryLimit: 5

  selector:
    matchLabels:
      app.kubernetes.io/name: otel-collector
      app.kubernetes.io/instance: flashstore

  template:
    metadata:
      labels:
        app.kubernetes.io/name: otel-collector
        app.kubernetes.io/instance: flashstore
        app.kubernetes.io/component: tracing
        app.kubernetes.io/part-of: flashstore

    spec:
      serviceAccountName: otel-collector

      terminationGracePeriodSeconds: 30

      containers:
        - name: otel-collector

          image: otel/opentelemetry-collector-contrib:0.120.0
          imagePullPolicy: IfNotPresent

          args:
            - --config=/etc/otelcol/config.yaml

          ports:
            - name: otlp-grpc
              containerPort: 4317
              protocol: TCP

            - name: otlp-http
              containerPort: 4318
              protocol: TCP

            - name: metrics
              containerPort: 8888
              protocol: TCP

            - name: health
              containerPort: 13133
              protocol: TCP

          volumeMounts:
            - name: config
              mountPath: /etc/otelcol
              readOnly: true

          readinessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: health
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: 100m
              memory: 256Mi

            limits:
              cpu: 500m
              memory: 512Mi

          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true

            capabilities:
              drop:
                - ALL

      volumes:
        - name: config

          configMap:
            name: otel-collector-config

            items:
              - key: config.yaml
                path: config.yaml