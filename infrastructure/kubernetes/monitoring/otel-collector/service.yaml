apiVersion: v1
kind: Service

metadata:
  name: otel-collector
  namespace: monitoring

  labels:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/version: "0.120.0"
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: flashstore
    app.kubernetes.io/managed-by: kubectl

  annotations:
    description: "OpenTelemetry Collector service for FlashStore traces"

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: otel-collector
    app.kubernetes.io/instance: flashstore

  ports:
    - name: otlp-grpc
      protocol: TCP
      port: 4317
      targetPort: 4317

    - name: otlp-http
      protocol: TCP
      port: 4318
      targetPort: 4318

    - name: metrics
      protocol: TCP
      port: 8888
      targetPort: 8888