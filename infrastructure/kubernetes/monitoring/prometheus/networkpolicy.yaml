apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app.kubernetes.io/name: prometheus
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/version: "1.0.0"
    app.kubernetes.io/component: monitoring
    app.kubernetes.io/part-of: flashstore
    app.kubernetes.io/managed-by: kubectl
  annotations:
    description: "Restrict network access to Prometheus"
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: prometheus
  policyTypes:
    - Ingress
    - Egress

  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - protocol: TCP
          port: 9090

  egress:
    # DNS
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP

    # Kubernetes API (service discovery)
    - to:
        - ipBlock:
            cidr: 10.96.0.1/32
      ports:
        - port: 443
          protocol: TCP

    # node-exporter hostNetwork (Docker Desktop node IPs)
    - to:
        - ipBlock:
            cidr: 172.19.0.0/16
      ports:
        - port: 9100
          protocol: TCP

    # Monitoring namespace scrapes (pod network)
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: monitoring
      ports:
        - port: 9093
          protocol: TCP
        - port: 3000
          protocol: TCP
        - port: 8080
          protocol: TCP
        - port: 9100
          protocol: TCP
        - port: 3100
          protocol: TCP
        - port: 3200
          protocol: TCP

    # FlashStore app metrics
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: flashstore
      ports:
        - port: 3000
          protocol: TCP
        - port: 3001
          protocol: TCP
        - port: 3002
          protocol: TCP
        - port: 3003
          protocol: TCP
        - port: 3004
          protocol: TCP
        - port: 3005
          protocol: TCP
        - port: 3006
          protocol: TCP
        - port: 3007
          protocol: TCP
        - port: 3008
          protocol: TCP
        - port: 4005
          protocol: TCP