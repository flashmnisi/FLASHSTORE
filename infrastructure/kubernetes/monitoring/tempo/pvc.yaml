apiVersion: v1
kind: PersistentVolumeClaim

metadata:
  name: tempo-data
  namespace: monitoring

  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/version: "2.8.1"
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: flashstore
    app.kubernetes.io/managed-by: kubectl

  annotations:
    description: "Persistent storage for Grafana Tempo traces and WAL"

spec:
  accessModes:
    - ReadWriteOnce

  storageClassName: standard

  resources:
    requests:
      storage: 10Gi

  volumeMode: Filesystem