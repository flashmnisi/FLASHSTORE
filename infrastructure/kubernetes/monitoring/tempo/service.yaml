apiVersion: v1
kind: Service

metadata:
  name: tempo
  namespace: monitoring

  labels:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: flashstore
    app.kubernetes.io/version: "2.8.1"
    app.kubernetes.io/component: tracing
    app.kubernetes.io/part-of: flashstore
    app.kubernetes.io/managed-by: kubectl

  annotations:
    description: "Grafana Tempo tracing service"

spec:
  type: ClusterIP

  selector:
    app.kubernetes.io/name: tempo
    app.kubernetes.io/instance: flashstore

  ports:
    - name: http
      port: 3200
      targetPort: http
      protocol: TCP

    - name: otlp-grpc
      port: 4317
      targetPort: otlp-grpc
      protocol: TCP

    - name: otlp-http
      port: 4318
      targetPort: otlp-http
      protocol: TCP