apiVersion: v1
kind: Service

metadata:
  name: cart-service
  namespace: flashstore

  labels:
    app: cart-service
    app.kubernetes.io/name: cart-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flashstore

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3003"

spec:
  type: ClusterIP

  selector:
    app: cart-service

  ports:
    - name: http
      protocol: TCP
      port: 3003
      targetPort: 3003