apiVersion: apps/v1
kind: Deployment
metadata:
  name: catalog-service
  namespace: flashstore
  labels:
    app: catalog-service
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flashstore
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  selector:
    matchLabels:
      app: catalog-service
  template:
    metadata:
      labels:
        app: catalog-service
        app.kubernetes.io/name: catalog-service
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: flashstore
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/path: "/metrics"
        prometheus.io/port: "3002"
    spec:
      terminationGracePeriodSeconds: 30
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
        - name: catalog-service
          image: flashmnisi/flashstore-catalog-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 3002
          volumeMounts:
            - name: uploads
              mountPath: /app/uploads
          envFrom:
            - configMapRef:
                name: flashstore-config
            - secretRef:
                name: flashstore-secrets
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /health
              port: 3002
            failureThreshold: 30
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 3002
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: uploads
          emptyDir: {}