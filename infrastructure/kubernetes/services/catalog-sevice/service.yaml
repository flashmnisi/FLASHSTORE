apiVersion: v1
kind: Service

metadata:
  name: catalog-service
  namespace: flashstore

  labels:
    app: catalog-service
    app.kubernetes.io/name: catalog-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flashstore

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "3002"

spec:
  type: ClusterIP

  selector:
    app: catalog-service

  ports:
    - name: http
      protocol: TCP
      port: 3002
      targetPort: 3002