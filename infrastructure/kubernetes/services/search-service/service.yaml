apiVersion: v1
kind: Service

metadata:
  name: search-service
  namespace: flashstore

  labels:
    app: search-service
    app.kubernetes.io/name: search-service
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: flashstore

  annotations:
    prometheus.io/scrape: "true"
    prometheus.io/path: "/metrics"
    prometheus.io/port: "4005"

spec:
  type: ClusterIP

  selector:
    app: search-service

  ports:
    - name: http
      protocol: TCP
      port: 4005
      targetPort: 4005